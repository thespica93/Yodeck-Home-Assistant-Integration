list_schedules:
  name: List Schedules
  description: List all available YoDeck schedules with their IDs (check logs or use as a script to see results)

list_media:
  name: List Media
  description: List all available YoDeck media with their IDs (check logs or use as a script to see results)

list_playlists:
  name: List Playlists
  description: List all available YoDeck playlists with their IDs (check logs or use as a script to see results)

list_layouts:
  name: List Layouts
  description: List all available YoDeck layouts with their IDs (check logs or use as a script to see results)

list_monitors:
  name: List Monitors
  description: List all available YoDeck screens/monitors with their IDs and assigned schedules (check logs or use as a script to see results)

add_schedule_event:
  name: Add Schedule Event
  description: Add a new event to a YoDeck schedule. You can enter either the ID number or the friendly name for schedule and content fields.
  fields:
    schedule:
      name: Schedule
      description: "Enter schedule ID or name (e.g., '1368183' or 'Main Schedule')"
      required: true
      example: Main Schedule
      selector:
        text:
    content_type:
      name: Content Type
      description: Type of content to schedule
      required: true
      selector:
        select:
          options:
            - label: Media
              value: media
            - label: Playlist
              value: playlist
            - label: Layout
              value: layout
    content:
      name: Content
      description: "Enter content ID or name (e.g., '28803949' or 'New Years Day Video')"
      required: true
      example: New Years Day Video
      selector:
        text:
    start_datetime:
      name: Start Date & Time
      description: "When the event should start (example: today at midnight)"
      required: true
      selector:
        datetime:
    end_datetime:
      name: End Date & Time
      description: "When the event should end (example: tomorrow at midnight for 24-hour event)"
      required: true
      selector:
        datetime:
    recurrence_type:
      name: Repeat Pattern
      description: How often the event should repeat
      required: true
      default: once
      selector:
        select:
          options:
            - label: Once (No repeat)
              value: once
            - label: Daily (Mon-Sun)
              value: daily
            - label: Every Weekday (Mon-Fri)
              value: weekday
            - label: Weekly (same day each week)
              value: weekly
            - label: Monthly (same date each month)
              value: monthly
            - label: Annually (same date each year)
              value: annually
    fitting:
      name: Fitting Option
      description: How the content should fit on the screen
      required: false
      default: fit
      selector:
        select:
          options:
            - label: Fit
              value: fit
            - label: Crop
              value: crop
            - label: Stretch
              value: stretch
    priority:
      name: Priority
      description: Event priority (higher numbers have higher priority)
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 10
          mode: slider
    screen:
      name: Screen
      description: "Enter screen ID or name to push the schedule update to (e.g., '577697' or 'Outdoor Screen'). You can find available screens in the sensor.yodeck_screens entity."
      required: true
      example: Outdoor Screen
      selector:
        text:
    delay:
      name: Delay Before Push
      description: "Optional delay in seconds (0-10) to wait after updating the schedule before pushing to the screen. Use 0 for no delay (default), or try 2-3 seconds if the screen doesn't update immediately."
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10
          mode: slider
