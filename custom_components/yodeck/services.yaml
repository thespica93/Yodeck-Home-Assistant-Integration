schedule_from_calendar_event:
  name: Schedule From Calendar Event
  description: >
    Finds a named event in a Home Assistant calendar (e.g. "Father's Day" from Google Calendar)
    and schedules YoDeck content to play for a window around that event date.
    If the same content is already scheduled for that period it is silently skipped.
  fields:
    calendar_entity:
      name: Calendar
      description: "The HA calendar entity to search (e.g. calendar.google_holidays_in_united_states)"
      required: true
      selector:
        entity:
          domain: calendar
    event_name:
      name: Event Name
      description: "Partial, case-insensitive name to search for (e.g. 'father' matches \"Father's Day\")"
      required: true
      example: Father's Day
      selector:
        text:
    days_before:
      name: Days Before Event
      description: How many days before the event start to begin showing content
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 60
          mode: box
          unit_of_measurement: days
    days_after:
      name: Days After Event
      description: How many days after the event ends to keep showing content
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 60
          mode: box
          unit_of_measurement: days
    look_ahead_days:
      name: Search Window (days)
      description: How far ahead to search for the event (default 365 days)
      required: false
      default: 365
      selector:
        number:
          min: 1
          max: 730
          mode: box
          unit_of_measurement: days
    schedule:
      name: Schedule
      description: "Name or ID of your YoDeck schedule (e.g. My Schedule). Run yodeck.list_schedules to see all names."
      required: true
      example: My Schedule
      selector:
        text:
    content_type:
      name: Content Type
      description: "Type of content to schedule"
      required: true
      selector:
        select:
          options:
            - label: Media
              value: media
            - label: Playlist
              value: playlist
            - label: Layout
              value: layout
    content:
      name: Content Name
      description: "Name or ID of the content (e.g. Christmas Video). Use list_media / list_playlists / list_layouts to see exact names."
      required: true
      example: "Christmas Video"
      selector:
        text:
    screen:
      name: Screen
      description: "Name or ID of your YoDeck screen (e.g. Main Screen). Run yodeck.list_monitors to see all names."
      required: true
      example: Main Screen
      selector:
        text:
    priority:
      name: Priority
      description: Event priority (higher numbers have higher priority)
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 10
          mode: slider
    delay:
      name: Delay Before Push
      description: Seconds to wait after updating the schedule before pushing to the screen
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10
          mode: slider

list_schedules:
  name: List Schedules
  description: Show all YoDeck schedules as a persistent notification — use the names here in the Schedule field.

list_media:
  name: List Media
  description: Show all YoDeck media as a persistent notification — use the names here in the Content Name field.

list_playlists:
  name: List Playlists
  description: Show all YoDeck playlists as a persistent notification — use the names here in the Content Name field.

list_layouts:
  name: List Layouts
  description: Show all YoDeck layouts as a persistent notification — use the names here in the Content Name field.

list_monitors:
  name: List Monitors/Screens
  description: Show all YoDeck screens as a persistent notification — use the names here in the Screen field.

add_schedule_event:
  name: Add Schedule Event
  description: Add a new event to a YoDeck schedule. Pick a schedule and screen from the dropdowns, and type the content name.
  fields:
    schedule:
      name: Schedule
      description: "Name or ID of your YoDeck schedule (e.g. My Schedule). Run yodeck.list_schedules to see all names."
      required: true
      example: My Schedule
      selector:
        text:
    content_type:
      name: Content Type
      description: "Type of content to schedule"
      required: true
      selector:
        select:
          options:
            - label: Media
              value: media
            - label: Playlist
              value: playlist
            - label: Layout
              value: layout
    content:
      name: Content Name
      description: "Name or ID of the content (e.g. Christmas Video). Use list_media / list_playlists / list_layouts to see exact names."
      required: true
      example: "Christmas Video"
      selector:
        text:
    duration_preset:
      name: Duration Preset
      description: "Quick duration options — automatically sets the end time. If set, End Date & Time is ignored. Leave blank to set start and end manually."
      required: false
      selector:
        select:
          options:
            - label: "Today (midnight to midnight)"
              value: today
            - label: "1 Hour from start"
              value: 1h
            - label: "2 Hours from start"
              value: 2h
            - label: "4 Hours from start"
              value: 4h
            - label: "8 Hours from start"
              value: 8h
            - label: "12 Hours from start"
              value: 12h
            - label: "24 Hours from start"
              value: 24h
            - label: "3 Days from start"
              value: 3d
            - label: "1 Week from start"
              value: 1w
    start_datetime:
      name: Start Date & Time
      description: "When the event should start. Ignored when 'Today' preset is selected. Defaults to now if left blank."
      required: false
      selector:
        datetime:
    end_datetime:
      name: End Date & Time
      description: "When the event should end. Required only when no Duration Preset is selected."
      required: false
      selector:
        datetime:
    recurrence_type:
      name: Repeat Pattern
      description: How often the event should repeat
      required: true
      default: once
      selector:
        select:
          options:
            - label: Once (No repeat)
              value: once
            - label: Daily (Mon-Sun)
              value: daily
            - label: Every Weekday (Mon-Fri)
              value: weekday
            - label: Weekly (same day each week)
              value: weekly
            - label: Monthly (same date each month)
              value: monthly
            - label: Annually (same date each year)
              value: annually
    # fitting:  # Not working yet — disabled for later
    #   name: Fitting Option
    #   description: How the content should fit on the screen
    #   required: false
    #   default: fit
    #   selector:
    #     select:
    #       options:
    #         - label: Fit
    #           value: fit
    #         - label: Crop
    #           value: crop
    #         - label: Stretch
    #           value: stretch
    priority:
      name: Priority
      description: Event priority (higher numbers have higher priority)
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 10
          mode: slider
    screen:
      name: Screen
      description: "Name or ID of your YoDeck screen (e.g. Main Screen). Run yodeck.list_monitors to see all names."
      required: true
      example: Main Screen
      selector:
        text:
    delay:
      name: Delay Before Push
      description: "Optional delay in seconds (0-10) to wait after updating the schedule before pushing to the screen."
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10
          mode: slider
